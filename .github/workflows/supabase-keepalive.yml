name: Supabase keep-alive

# Supabase pauses Free projects after ~7 days of low activity. Mon+Thu gives a
# 3-4 day gap, so one failed run still leaves a retry before the cutoff.
on:
  schedule:
    - cron: "23 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the keepalive table (real DB query)
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL not set"; exit 0; fi
          curl -sS --fail --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" -o /dev/null -w 'HTTP %{http_code}\n'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
