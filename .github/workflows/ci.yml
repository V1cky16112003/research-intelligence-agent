name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch: a newer push cancels the older run. Overlapping runs
# share one Groq judge quota (8000 TPM), and on 2026-10-07 four overlapping
# RAGAS gates 429'd each other into false faithfulness failures.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check . --ignore E501,E402

      - name: Unit tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ""
          REDIS_URL: ""
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Each ignore is a known finding with no usable fix, reviewed 2026-10-09; any
      # other advisory fails the build. Re-check these when bumping the pins.
      #   transformers PYSEC-2025-217/2026-2288/2289/2290/3929/4174 — fixes are 5.x;
      #     pinned <5.0 for the nomic MoE embedder, and we load only that one trusted model.
      #   ragas PYSEC-2026-3046, nltk PYSEC-2026-3740, diskcache PYSEC-2026-2447 —
      #     no fixed release; eval-only path (ragas pulls the other two), not served.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174 \
            --ignore-vuln PYSEC-2026-3046 --ignore-vuln PYSEC-2026-3740 \
            --ignore-vuln PYSEC-2026-2447

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build + npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API is mocked inside each spec (page.route), so this needs no secrets
      # and spends no provider quota.
      - name: Run Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  ragas-quality-gate:
    name: RAGAS Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-test
    # Only run on PRs and pushes to main (not on forks without secrets)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nomic-embed-text-v2-moe
          restore-keys: hf-nomic-embed-text-v2-moe

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAGAS quality gate
        run: python -m eval.run_ragas --ci --limit 3
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
          MLFLOW_TRACKING_URI: "https://dagshub.com/${{ secrets.DAGSHUB_REPO }}.mlflow"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"

  keep-alive:
    name: Keep HF Space Alive
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Ping HF Space
        run: |
          HF_URL="${{ secrets.HF_SPACE_URL }}"
          if [ -n "$HF_URL" ]; then
            curl -sf "$HF_URL/health" || echo "Space may be cold-starting, that's OK"
          else
            echo "HF_SPACE_URL secret not set yet -- skipping keep-alive"
          fi
